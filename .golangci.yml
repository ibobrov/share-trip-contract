version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - errorlint
    - bodyclose
    - testifylint
    - paralleltest

  exclusions:
    rules:
      # На границах слоёв DTO заполняются явно, даже при одинаковых полях.
      - path: internal/(api|service|domain)/
        linters:
          - staticcheck
        text: 'S1016:'

  settings:
    errcheck:
      check-blank: false
openapi: 3.0.3
info:
  title: ShareTrip Contract Service API
  version: 0.1.0
  description: "Все ответы: data — результат или null, errors — массив сообщений; при успехе пустой."
tags:
  - name: Contracts
  - name: Options
paths:
  /api/contract/create:
    post:
      tags: [Contracts]
      operationId: createContract
      summary: Создать договор компании
      description: Создаёт draft. expires_at > starts_at; коды услуг уникальны.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
      responses:
        '201':
          description: Договор создан в статусе draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/contract/activate:
    post:
      tags: [Contracts]
      operationId: activateContract
      summary: Активировать договор
      description: Только draft может перейти в active. Для остальных статусов — 409.
      requestBody:
        $ref: '#/components/requestBodies/ContractId'
      responses:
        '201':
          description: Договор активирован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateContractResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ContractNotFound'
        '409':
          description: Статус не draft или у компании уже есть активный договор.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidStatus:
                  value:
                    data: null
                    errors:
                      - Активировать можно только договор в статусе draft.
                activeContractExists:
                  value:
                    data: null
                    errors:
                      - У компании уже есть активный договор.
        '500':
          $ref: '#/components/responses/InternalError'
  /api/contract/get-by-id:
    post:
      tags: [Contracts]
      operationId: getContractById
      summary: Получить договор по идентификатору
      requestBody:
        $ref: '#/components/requestBodies/ContractId'
      responses:
        '200':
          description: Договор найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ContractNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/contract/get-active:
    post:
      tags: [Contracts]
      operationId: getActiveContract
      summary: Получить активный договор компании
      description: Статус active; expires_at отсутствует или позже текущего момента. Иначе — 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyId'
      responses:
        '200':
          description: Активный договор найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Активный договор не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                errors:
                  - Действующий активный договор не найден.
        '500':
          $ref: '#/components/responses/InternalError'
  /api/option/check:
    post:
      tags: [Options]
      operationId: checkOption
      summary: Проверить доступность услуги для компании
      description: Доступна при active, действующем сроке и включённой услуге в договоре.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckOptionRequest'
      responses:
        '200':
          description: Результат проверки доступности услуги.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckOptionResultResponse'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  requestBodies:
    ContractId:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContractId'
  responses:
    ValidationError:
      description: Ошибка валидации.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: null
            errors:
              - Некорректные параметры запроса.
    ContractNotFound:
      description: Договор не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: null
            errors:
              - Договор не найден.
    InternalError:
      description: Внутренняя ошибка сервиса.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: null
            errors:
              - Внутренняя ошибка сервиса.
  schemas:
    ContractId:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          example: 'b2c3d4e5-2222-4222-8222-23456789abcd'
    CompanyId:
      type: object
      additionalProperties: false
      required: [company_id]
      properties:
        company_id:
          type: string
          format: uuid
          example: 'a1b2c3d4-1111-4111-8111-123456789abc'
    OptionCode:
      type: string
      enum: [trip_creation, trip_participants, notifications]
      description: Код услуги.
      example: trip_creation
    ContractOption:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/OptionCode'
    ContractOptions:
      type: array
      minItems: 1
      uniqueItems: true
      description: Непустой список с уникальными кодами услуг.
      items:
        $ref: '#/components/schemas/ContractOption'
    CreateContractRequest:
      type: object
      additionalProperties: false
      required: [company_id, starts_at, options]
      properties:
        company_id:
          type: string
          format: uuid
          example: 'a1b2c3d4-1111-4111-8111-123456789abc'
        starts_at:
          type: string
          format: date-time
          example: '2026-11-01T00:00:00+03:00'
        expires_at:
          type: string
          format: date-time
          description: Позже starts_at. Без поля договор бессрочный.
          example: '2027-11-01T00:00:00+03:00'
        options:
          $ref: '#/components/schemas/ContractOptions'
    Contract:
      type: object
      additionalProperties: false
      required: [id, company_id, status, starts_at, options]
      properties:
        id:
          type: string
          format: uuid
          example: 'b2c3d4e5-2222-4222-8222-23456789abcd'
        company_id:
          type: string
          format: uuid
          example: 'a1b2c3d4-1111-4111-8111-123456789abc'
        status:
          type: string
          enum: [draft, active, suspended, terminated]
          example: active
        starts_at:
          type: string
          format: date-time
          example: '2026-11-01T00:00:00+03:00'
        expires_at:
          type: string
          format: date-time
          description: Без поля договор бессрочный.
          example: '2027-11-01T00:00:00+03:00'
        options:
          $ref: '#/components/schemas/ContractOptions'
    CheckOptionRequest:
      type: object
      additionalProperties: false
      required: [company_id, option_code]
      properties:
        company_id:
          type: string
          format: uuid
          example: 'a1b2c3d4-1111-4111-8111-123456789abc'
        option_code:
          $ref: '#/components/schemas/OptionCode'
    CheckOptionResponse:
      description: При allowed=true причина отсутствует; при allowed=false обязательна.
      oneOf:
        - $ref: '#/components/schemas/OptionAllowed'
        - $ref: '#/components/schemas/OptionDenied'
    OptionAllowed:
      type: object
      additionalProperties: false
      required: [allowed]
      properties:
        allowed:
          type: boolean
          enum: [true]
    OptionDenied:
      type: object
      additionalProperties: false
      required: [allowed, reason]
      properties:
        allowed:
          type: boolean
          enum: [false]
        reason:
          type: string
          enum:
            - CONTRACT_NOT_FOUND
            - NO_ACTIVE_CONTRACT
            - CONTRACT_NOT_STARTED
            - CONTRACT_EXPIRED
            - SERVICE_NOT_ALLOWED
          description: Причина отказа.
    ContractResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data:
          $ref: '#/components/schemas/Contract'
        errors:
          $ref: '#/components/schemas/EmptyErrors'
    ActivateContractResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data:
          $ref: '#/components/schemas/ContractId'
        errors:
          $ref: '#/components/schemas/EmptyErrors'
    CheckOptionResultResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data:
          $ref: '#/components/schemas/CheckOptionResponse'
        errors:
          $ref: '#/components/schemas/EmptyErrors'
    EmptyErrors:
      type: array
      maxItems: 0
      items:
        type: string
      example: []
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data:
          type: object
          nullable: true
          enum: [null]
        errors:
          type: array
          minItems: 1
          items:
            type: string

openapi: 3.0.3
info:
  title: ShareTrip Contract Service API
  version: 0.1.0
  description: "Все ответы: data — результат или null, errors — массив сообщений; при успехе пустой."
tags:
  - name: Contracts
  - name: Options
paths:
  /api/contract/create:
    post:
      tags: [Contracts]
      operationId: createContract
      summary: Создать договор компании
      description: Создаёт draft. expires_at > starts_at; коды услуг уникальны.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
      responses:
        '201':
          description: Договор создан в статусе draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateContractHTTPResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/contract/activate:
    post:
      tags: [Contracts]
      operationId: activateContract
      summary: Активировать договор
      description: Только draft может перейти в active. Для остальных статусов — 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateContractRequest'
      responses:
        '201':
          description: Договор активирован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateContractHTTPResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ContractNotFound'
        '409':
          description: Статус не draft или у компании уже есть активный договор.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidStatus:
                  value:
                    data: null
                    errors:
                      - Активировать можно только договор в статусе draft.
                activeContractExists:
                  value:
                    data: null
                    errors:
                      - У компании уже есть активный договор.
        '500':
          $ref: '#/components/responses/InternalError'
  /api/contract/get-by-id:
    post:
      tags: [Contracts]
      operationId: getContractById
      summary: Получить договор по идентификатору
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetContractByIdRequest'
      responses:
        '200':
          description: Договор найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContractByIdHTTPResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ContractNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/contract/get-active:
    post:
      tags: [Contracts]
      operationId: getActiveContract
      summary: Получить активный договор компании
      description: Статус active; expires_at равен null или позже текущего момента. Иначе — 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetActiveContractRequest'
      responses:
        '200':
          description: Активный договор найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetActiveContractHTTPResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Активный договор не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                errors:
                  - Действующий активный договор не найден.
        '500':
          $ref: '#/components/responses/InternalError'
  /api/option/check:
    post:
      tags: [Options]
      operationId: checkOption
      summary: Проверить доступность услуги для компании
      description: Доступна при active, действующем сроке и включённой услуге в договоре.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckOptionRequest'
      responses:
        '200':
          description: Результат проверки доступности услуги.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckOptionHTTPResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    ValidationError:
      description: Ошибка валидации.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: null
            errors:
              - Некорректные параметры запроса.
    ContractNotFound:
      description: Договор не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: null
            errors:
              - Договор не найден.
    InternalError:
      description: Внутренняя ошибка сервиса.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: null
            errors:
              - Внутренняя ошибка сервиса.
  schemas:
    OptionCode:
      type: string
      enum: [trip_creation, trip_participants, notifications]
      description: Код услуги.
      example: trip_creation
    ContractOption:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          x-oapi-codegen-extra-tags:
            valid: "required~код услуги обязателен,in(trip_creation|trip_participants|notifications)~неизвестная услуга"
          $ref: '#/components/schemas/OptionCode'
    ContractOptions:
      type: array
      minItems: 1
      uniqueItems: true
      description: Непустой список с уникальными кодами услуг.
      items:
        $ref: '#/components/schemas/ContractOption'
    CreateContractRequest:
      type: object
      additionalProperties: false
      required: [company_id, starts_at, options]
      properties:
        company_id:
          x-oapi-codegen-extra-tags:
            valid: "required~company_id обязателен"
          x-go-name: CompanyID
          type: string
          minLength: 1
          example: company-acme
        starts_at:
          x-oapi-codegen-extra-tags:
            valid: "required~starts_at обязателен"
          type: string
          format: date-time
          example: '2026-11-01T00:00:00+03:00'
        expires_at:
          type: string
          format: date-time
          description: Позже starts_at. Без поля договор бессрочный.
          example: '2027-11-01T00:00:00+03:00'
        options:
          x-oapi-codegen-extra-tags:
            valid: "required~список options не должен быть пустым"
          $ref: '#/components/schemas/ContractOptions'
    Contract:
      type: object
      additionalProperties: false
      required: [id, company_id, status, starts_at, expires_at, options]
      properties:
        id:
          x-go-name: ID
          type: string
          format: uuid
          example: 'b2c3d4e5-2222-4222-8222-23456789abcd'
        company_id:
          x-go-name: CompanyID
          type: string
          minLength: 1
          example: company-acme
        status:
          type: string
          enum: [draft, active, suspended, terminated]
          example: active
        starts_at:
          type: string
          format: date-time
          example: '2026-11-01T00:00:00+03:00'
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: null для бессрочного договора.
          example: '2027-11-01T00:00:00+03:00'
        options:
          $ref: '#/components/schemas/ContractOptions'
    CheckOptionRequest:
      type: object
      additionalProperties: false
      required: [company_id, option_code]
      properties:
        company_id:
          x-oapi-codegen-extra-tags:
            valid: "required~company_id обязателен"
          x-go-name: CompanyID
          type: string
          minLength: 1
          example: company-acme
        option_code:
          x-oapi-codegen-extra-tags:
            valid: "required~option_code обязателен,in(trip_creation|trip_participants|notifications)~UNKNOWN_SERVICE"
          $ref: '#/components/schemas/OptionCode'
    ActivateContractRequest:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          x-oapi-codegen-extra-tags:
            valid: "nonzeroUUID~id обязателен"
          x-go-name: ID
          type: string
          format: uuid
          example: 'b2c3d4e5-2222-4222-8222-23456789abcd'
    GetContractByIdRequest:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          x-oapi-codegen-extra-tags:
            valid: "nonzeroUUID~id обязателен"
          x-go-name: ID
          type: string
          format: uuid
          example: 'b2c3d4e5-2222-4222-8222-23456789abcd'
    GetActiveContractRequest:
      type: object
      additionalProperties: false
      required: [company_id]
      properties:
        company_id:
          x-oapi-codegen-extra-tags:
            valid: "required~company_id обязателен"
          x-go-name: CompanyID
          type: string
          minLength: 1
          example: company-acme
    ActivateContractResponse:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          x-go-name: ID
          type: string
          format: uuid
          example: 'b2c3d4e5-2222-4222-8222-23456789abcd'
    CreateContractResponse:
      type: object
      additionalProperties: false
      required: [id, company_id, status, starts_at, expires_at, options]
      properties:
        id:
          x-go-name: ID
          type: string
          format: uuid
          example: 'b2c3d4e5-2222-4222-8222-23456789abcd'
        company_id:
          x-go-name: CompanyID
          type: string
          minLength: 1
          example: company-acme
        status:
          type: string
          enum: [draft, active, suspended, terminated]
          example: active
        starts_at:
          type: string
          format: date-time
          example: '2026-11-01T00:00:00+03:00'
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: null для бессрочного договора.
          example: '2027-11-01T00:00:00+03:00'
        options:
          $ref: '#/components/schemas/ContractOptions'
    GetContractByIdResponse:
      type: object
      additionalProperties: false
      required: [id, company_id, status, starts_at, expires_at, options]
      properties:
        id:
          x-go-name: ID
          type: string
          format: uuid
          example: 'b2c3d4e5-2222-4222-8222-23456789abcd'
        company_id:
          x-go-name: CompanyID
          type: string
          minLength: 1
          example: company-acme
        status:
          type: string
          enum: [draft, active, suspended, terminated]
          example: active
        starts_at:
          type: string
          format: date-time
          example: '2026-11-01T00:00:00+03:00'
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: null для бессрочного договора.
          example: '2027-11-01T00:00:00+03:00'
        options:
          $ref: '#/components/schemas/ContractOptions'
    GetActiveContractResponse:
      type: object
      additionalProperties: false
      required: [id, company_id, status, starts_at, expires_at, options]
      properties:
        id:
          x-go-name: ID
          type: string
          format: uuid
          example: 'b2c3d4e5-2222-4222-8222-23456789abcd'
        company_id:
          x-go-name: CompanyID
          type: string
          minLength: 1
          example: company-acme
        status:
          type: string
          enum: [draft, active, suspended, terminated]
          example: active
        starts_at:
          type: string
          format: date-time
          example: '2026-11-01T00:00:00+03:00'
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: null для бессрочного договора.
          example: '2027-11-01T00:00:00+03:00'
        options:
          $ref: '#/components/schemas/ContractOptions'
    CheckOptionResponse:
      type: object
      additionalProperties: false
      required: [allowed]
      description: При allowed=true причина отсутствует; при allowed=false обязательна.
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          enum: [CONTRACT_NOT_FOUND, NO_ACTIVE_CONTRACT, CONTRACT_NOT_STARTED, CONTRACT_EXPIRED, SERVICE_NOT_ALLOWED]
    Response:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data: {}
        errors:
          type: array
          items:
            type: string
    CreateContractHTTPResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data:
          $ref: '#/components/schemas/CreateContractResponse'
        errors:
          $ref: '#/components/schemas/EmptyErrors'
    ActivateContractHTTPResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data:
          $ref: '#/components/schemas/ActivateContractResponse'
        errors:
          $ref: '#/components/schemas/EmptyErrors'
    GetContractByIdHTTPResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data:
          $ref: '#/components/schemas/GetContractByIdResponse'
        errors:
          $ref: '#/components/schemas/EmptyErrors'
    GetActiveContractHTTPResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data:
          $ref: '#/components/schemas/GetActiveContractResponse'
        errors:
          $ref: '#/components/schemas/EmptyErrors'
    CheckOptionHTTPResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data:
          $ref: '#/components/schemas/CheckOptionResponse'
        errors:
          $ref: '#/components/schemas/EmptyErrors'
    EmptyErrors:
      type: array
      maxItems: 0
      items:
        type: string
      example: []
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [data, errors]
      properties:
        data:
          type: object
          nullable: true
          enum: [null]
        errors:
          type: array
          minItems: 1
          items:
            type: string
